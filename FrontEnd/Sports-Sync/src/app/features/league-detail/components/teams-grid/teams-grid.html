<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  @for (team of teams(); track team.id) {
    <div class="flex flex-col gap-4 border border-white/10 p-5">
      <div class="flex items-center gap-3">
        <app-team-badge [code]="team.shortCode" [badgeClass]="team.badgeClass" size="md" />
        <h3 class="font-[family-name:var(--font-display)] text-lg uppercase leading-none tracking-tight">
          {{ team.name }}
        </h3>
      </div>
      <dl class="grid grid-cols-2 gap-y-2 font-mono text-xs uppercase tracking-widest">
        <dt class="text-slate-500">Stadium</dt>
        <dd class="text-right text-slate-200">{{ team.stadium }}</dd>
        <dt class="text-slate-500">Founded</dt>
        <dd class="text-right text-slate-200">{{ team.founded }}</dd>
        <dt class="text-slate-500">Manager</dt>
        <dd class="text-right text-slate-200">{{ team.manager }}</dd>
      </dl>
    </div>
  }
</div>
