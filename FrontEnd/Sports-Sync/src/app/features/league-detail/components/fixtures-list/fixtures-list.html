<div class="flex flex-col">
  @for (fixture of rows(); track fixture.id) {
    <div class="flex items-center gap-4 border-b border-white/5 py-4 text-sm">
      <span class="w-12 shrink-0 font-mono text-[11px] uppercase tracking-widest text-slate-500">
        MD {{ fixture.matchday }}
      </span>

      <span class="flex-1 text-right font-semibold">{{ fixture.homeTeam?.name }}</span>

      @if (fixture.status === 'FT') {
        <span class="flex w-16 shrink-0 items-center justify-center gap-2 font-mono text-base font-bold">
          {{ fixture.homeScore }} - {{ fixture.awayScore }}
        </span>
      } @else {
        <span class="w-16 shrink-0 text-center font-mono text-xs font-semibold uppercase tracking-widest text-accent">
          {{ fixture.kickoffLabel }}
        </span>
      }

      <span class="flex-1 text-left font-semibold">{{ fixture.awayTeam?.name }}</span>

      <span class="w-10 shrink-0 text-right font-mono text-[11px] uppercase tracking-widest text-slate-500">
        {{ fixture.status === 'FT' ? 'FT' : 'vs' }}
      </span>
    </div>
  }
</div>
