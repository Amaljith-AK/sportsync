<div class="w-56 max-w-[80vw] rounded-2xl border border-white/10 bg-neutral-900/95 p-4 shadow-2xl shadow-black/40 backdrop-blur sm:w-64 sm:max-w-none">
  <p class="mb-3 text-center font-mono text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-400">
    Win Probability
  </p>

  <div class="flex flex-col gap-2.5">
    <div class="flex items-center gap-2">
      @if (homeTeam()?.crestUrl) {
        <img [src]="homeTeam()?.crestUrl" [alt]="homeTeam()?.name ?? ''" class="h-6 w-6 shrink-0 object-contain" />
      } @else {
        <app-team-badge [code]="homeTeam()?.shortCode ?? 'H'" [badgeClass]="homeTeam()?.badgeClass ?? 'bg-slate-700'" />
      }
      <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-white/10">
        <div class="h-full rounded-full bg-accent" [style.width.%]="probability().homeWinPct"></div>
      </div>
      <span class="w-9 shrink-0 text-right font-mono text-xs font-semibold text-accent">{{ probability().homeWinPct }}%</span>
    </div>

    <div class="flex items-center gap-2">
      <span class="flex h-6 w-6 shrink-0 items-center justify-center font-mono text-[9px] uppercase tracking-wider text-slate-500">
        Draw
      </span>
      <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-white/10">
        <div class="h-full rounded-full bg-slate-400" [style.width.%]="probability().drawPct"></div>
      </div>
      <span class="w-9 shrink-0 text-right font-mono text-xs font-semibold text-slate-300">{{ probability().drawPct }}%</span>
    </div>

    <div class="flex items-center gap-2">
      @if (awayTeam()?.crestUrl) {
        <img [src]="awayTeam()?.crestUrl" [alt]="awayTeam()?.name ?? ''" class="h-6 w-6 shrink-0 object-contain" />
      } @else {
        <app-team-badge [code]="awayTeam()?.shortCode ?? 'A'" [badgeClass]="awayTeam()?.badgeClass ?? 'bg-slate-700'" />
      }
      <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-white/10">
        <div class="h-full rounded-full bg-sky-400" [style.width.%]="probability().awayWinPct"></div>
      </div>
      <span class="w-9 shrink-0 text-right font-mono text-xs font-semibold text-sky-300">{{ probability().awayWinPct }}%</span>
    </div>
  </div>
</div>
