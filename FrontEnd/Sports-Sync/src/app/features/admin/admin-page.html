<main class="mx-auto max-w-3xl px-6 py-16 sm:px-8">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <span class="font-mono text-xs font-semibold uppercase tracking-widest text-accent">Admin</span>
      <h1 class="font-[family-name:var(--font-display)] text-4xl uppercase leading-none tracking-tight sm:text-5xl">
        Data Controls
      </h1>
    </div>

    <button
      type="button"
      (click)="logout()"
      class="shrink-0 border border-white/20 px-4 py-2 font-mono text-xs font-semibold uppercase tracking-widest text-slate-300 transition-colors hover:border-red-400 hover:text-red-400"
    >
      Logout
    </button>
  </div>

  <p class="mt-3 max-w-xl font-mono text-xs uppercase tracking-widest text-slate-400">
    Manual overrides for the background jobs &mdash; bypass the schedule and run them on demand.
  </p>

  <div class="mt-10 flex flex-col gap-6">
    @for (action of actions; track action.id) {
      <div class="border border-white/10 p-6">
        <div class="flex flex-wrap items-center justify-between gap-6">
          <div>
            <p class="font-[family-name:var(--font-display)] text-lg uppercase tracking-tight">{{ action.title }}</p>
            <p class="mt-1 max-w-sm font-mono text-[11px] uppercase tracking-widest text-slate-500">
              {{ action.description }}
            </p>
          </div>

          <button
            type="button"
            (click)="trigger(action)"
            [disabled]="action.status() === 'loading'"
            class="shrink-0 border border-accent bg-accent px-6 py-3 font-mono text-xs font-semibold uppercase tracking-widest text-neutral-950 transition-colors hover:bg-accent-dim disabled:cursor-not-allowed disabled:opacity-50"
          >
            {{ action.status() === 'loading' ? 'Triggering…' : 'Trigger' }}
          </button>
        </div>

        @if (action.message()) {
          <p
            class="mt-4 font-mono text-xs uppercase tracking-widest"
            [class]="action.status() === 'error' ? 'text-red-400' : 'text-accent'"
          >
            {{ action.message() }}
          </p>
        }
      </div>
    }
  </div>
</main>
