<div class="auth-backdrop flex min-h-[70vh] items-center justify-center px-6 py-16">
  <div class="auth-card" [class.shake]="error()">
    <div class="lock-badge">
      <span class="lock-ring"></span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <span class="font-mono text-xs font-semibold uppercase tracking-widest text-accent">Restricted Area</span>
    <h1 class="mt-1 font-[family-name:var(--font-display)] text-3xl uppercase leading-none tracking-tight">
      Admin Access
    </h1>
    <p class="mt-3 font-mono text-[11px] uppercase tracking-widest text-slate-500">
      Enter the admin key to continue
    </p>

    <form class="mt-8 flex flex-col gap-4 text-left" (ngSubmit)="submit()">
      <input
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        [class.error]="error()"
        class="auth-input"
      />

      @if (error()) {
        <p class="-mt-1 font-mono text-[11px] uppercase tracking-widest text-red-400">Invalid key — try again.</p>
      }

      <button
        type="submit"
        [disabled]="isSubmitting() || !password()"
        class="border border-accent bg-accent px-6 py-3 font-mono text-xs font-semibold uppercase tracking-widest text-neutral-950 transition-colors hover:bg-accent-dim disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Verifying…' : 'Login' }}
      </button>
    </form>
  </div>
</div>
