<header class="border-b border-white/10">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-8 gap-y-4 px-6 py-5 sm:px-8">
    <button
      type="button"
      (click)="goTo('/')"
      class="font-[family-name:var(--font-display)] text-2xl tracking-tight text-accent"
    >
      SPORTSYNC
    </button>

    <nav class="flex flex-wrap items-center gap-x-8 gap-y-2">
      @for (sport of navSports(); track sport.id) {
        @if (sport.route) {
          <button
            type="button"
            (click)="goTo(sport.route)"
            class="border-b-2 pb-1 font-mono text-xs font-semibold uppercase tracking-widest transition-colors"
            [class]="isActive(sport.route) ? 'border-accent text-accent' : 'border-transparent text-white hover:text-accent'"
          >
            {{ sport.label }}
          </button>
        } @else {
          <span
            class="flex cursor-not-allowed items-center gap-2 pb-1 font-mono text-xs font-semibold uppercase tracking-widest text-white/40"
          >
            {{ sport.label }}
            <span class="rounded border border-white/20 px-1.5 py-0.5 text-[10px] text-white/40">Soon</span>
          </span>
        }
      }
    </nav>

    <div class="flex items-center gap-2 font-mono text-xs uppercase tracking-widest text-slate-400">
      <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-red-500 opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-red-500"></span>
      </span>
      Live feed: demo data
    </div>

    <button
      type="button"
      (click)="goToAdmin()"
      aria-label="Admin"
      class="text-slate-400 transition-colors hover:text-accent"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5"
      >
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        ></path>
      </svg>
    </button>
  </div>
</header>
