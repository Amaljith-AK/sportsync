<main class="mx-auto max-w-7xl px-6 py-12 sm:px-8" aria-busy="true" aria-live="polite">
  <div class="mb-8 h-3 w-28 animate-pulse rounded bg-white/10"></div>

  <div class="flex flex-wrap items-end justify-between gap-8 border-b border-white/10 pb-8">
    <div class="space-y-3">
      <div class="h-3 w-16 animate-pulse rounded bg-white/10"></div>
      <div class="h-10 w-72 animate-pulse rounded bg-white/10 sm:h-12 sm:w-96"></div>
      <div class="h-3 w-64 animate-pulse rounded bg-white/10"></div>
    </div>

    <div class="flex gap-10">
      @for (block of statBlocks; track $index) {
        <div class="space-y-2">
          <div class="h-3 w-16 animate-pulse rounded bg-white/10"></div>
          <div class="h-5 w-20 animate-pulse rounded bg-white/10"></div>
        </div>
      }
    </div>
  </div>

  <div class="mt-10 flex justify-center">
    <div class="h-3 w-56 animate-pulse rounded bg-white/10"></div>
  </div>

  <nav class="mt-4 flex justify-center gap-8 border-b border-white/10 pb-3">
    @for (tab of tabBlocks; track $index) {
      <div class="h-5 w-20 animate-pulse rounded bg-white/10"></div>
    }
  </nav>

  <div class="mt-10 grid grid-cols-1 gap-12 lg:grid-cols-[1fr_320px]">
    <div class="space-y-3">
      @for (row of standingsRows; track $index) {
        <div class="h-10 w-full animate-pulse rounded bg-white/10"></div>
      }
    </div>

    <div class="space-y-4">
      @for (block of sidePanelBlocks; track $index) {
        <div class="h-24 w-full animate-pulse rounded bg-white/10"></div>
      }
    </div>
  </div>
</main>
