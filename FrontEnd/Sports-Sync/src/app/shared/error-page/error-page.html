<main class="mx-auto flex min-h-[70vh] max-w-3xl flex-col items-center justify-center px-6 text-center sm:px-8">
  <span class="font-mono text-xs font-semibold uppercase tracking-widest text-accent">Error {{ code() }}</span>

  <h1 class="mt-4 font-[family-name:var(--font-display)] text-7xl uppercase leading-none tracking-tight sm:text-8xl">
    {{ code() }}
  </h1>

  <p class="mt-4 font-[family-name:var(--font-display)] text-2xl uppercase tracking-tight text-white/80">
    {{ title() }}
  </p>

  @if (message()) {
    <p class="mt-4 max-w-md text-sm text-slate-400">
      {{ message() }}
    </p>
  }

  <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
    <button
      type="button"
      (click)="goHome()"
      class="border border-accent bg-accent px-6 py-3 font-mono text-xs font-semibold uppercase tracking-widest text-neutral-950 transition-colors hover:bg-accent-dim"
    >
      Back to Home
    </button>

    @if (showRetry()) {
      <button
        type="button"
        (click)="retry()"
        class="border border-white/20 px-6 py-3 font-mono text-xs font-semibold uppercase tracking-widest text-slate-300 transition-colors hover:border-accent hover:text-accent"
      >
        Try Again
      </button>
    }
  </div>
</main>
